{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Asignaturas</title>
    <link rel="stylesheet" href="{% static 'asignaturas/css/estilos.css' %}">
</head>
<body>
    <h1>Lista de Asignaturas</h1>
    <table border="1" style="width: 80%; margin: 0 auto; border-collapse: collapse; text-align: center;">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Profesor</th>
                <th>Horas Semanales</th>
                <th>Imagen</th>
            </tr>
        </thead>
        <tbody>
            {% for asignatura in asignaturas %}
            <tr>
                <td>{{ asignatura.nombre }}</td>
                <td>{{ asignatura.profesor }}</td>
                <td>{{ asignatura.horas_semanales }}</td>
                <td>
                    <img src="{% static asignatura.imagen %}" alt="{{ asignatura.nombre }}" style="max-width: 100px;">
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
