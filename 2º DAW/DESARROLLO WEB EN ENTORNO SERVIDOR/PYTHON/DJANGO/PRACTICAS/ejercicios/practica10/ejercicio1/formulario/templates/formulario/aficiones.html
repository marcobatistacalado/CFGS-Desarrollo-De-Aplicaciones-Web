<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Aficiones</title>
</head>
<body>
    <h1>Formulario de Aficiones</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Renderiza el formulario -->
        <button type="submit">Enviar</button>
    </form>

    {% if mensaje %}
        <p>{{ mensaje }}</p>
    {% endif %}

    {% if aficiones %}
        {% if aficiones|length > 1 %}
            <ul>
                {% for aficion in aficiones %}
                    <li>{{ aficion }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endif %}
</body>
</html>
