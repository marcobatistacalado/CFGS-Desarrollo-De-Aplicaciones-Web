    <!--SUSTITUMIMOS POR @INPUT()-->
    <app-detalle [producto]="producto"></app-detalle>

    <!-- Sección de Comentarios -->
    <div *ngIf="comentarios.length > 0" class="mt-5">
        <h3>Comentarios</h3>
        <div *ngFor="let comentario of comentarios" class="card mb-3">
            <div class="card-body">
                <p><strong>{{ comentario.nombre }}</strong> dijo:</p>
                <p class="card-text">{{ comentario.comentario }}</p>
                <!-- Aquí puedes agregar una fecha si se tiene -->
                <p class="card-text"><small class="text-muted">Comentario de {{ comentario.email }}</small></p>
            </div>
        </div>
    </div>

    <!-- Si no hay comentarios, mostrar mensaje -->
    <div *ngIf="comentarios.length === 0" class="mt-4">
        <p>No hay comentarios para este producto aún.</p>
    </div>
</div>
