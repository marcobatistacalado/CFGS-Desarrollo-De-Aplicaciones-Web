<div class="container"><br>
  <h2>Lista de Series</h2><br>
  <ul>
    <li *ngFor="let serie of series">
      <a routerLink="/contenido-serie/{{serie.id}}">
        <img src="/assets/Imagenes/{{serie.imagen}}" alt="{{ serie.titulo }}" />
      </a>
      <div>
          <p><strong>Título:</strong> {{ serie.titulo }}</p>
          <p><strong>Plataforma:</strong> {{ serie.plataforma }}</p>
          <p><strong>Temporadas:</strong> {{ serie.temporadas }}</p>
          <p><strong>Actores:</strong> 
              {{ serie.actores?.join(', ') }} <!--ESTO MEJOR CON PIPE-->
          </p>
      </div>
    </li>
  </ul>
</div>
