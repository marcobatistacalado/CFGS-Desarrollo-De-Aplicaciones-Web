<table class="table">
  <thead class="table-dark">
    <tr>
      <th>EJEMPLO DIRECTIVAS ESTRUCTURALES</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <h1>Información sobre {{nombre}}</h1>
        <hr>
        <p>Asignatura: {{asignatura}}</p>
        <p>Nota: {{nota}}</p>
        <p *ngIf ="nota >= 5; else suspenso">Aprobado</p>
        <ng-template #suspenso>
          <p>Suspenso</p>
        </ng-template>
      </td>
    </tr>
  </tbody>
</table>
