<app-header></app-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row justify-content-center>
      <ion-col *ngFor="let book of books" size="6">
        <ion-card (click)="goToBookDetails(book.id)"> <!--CLICK CON NAVIGATE CONTROL-->
          <img [src]="book.cover" alt="Portada" class="lenguaje-imagen" />
          <ion-card-header>
            <ion-card-title>{{ book.title }}</ion-card-title>
            <ion-card-subtitle>{{ book.author }}</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
