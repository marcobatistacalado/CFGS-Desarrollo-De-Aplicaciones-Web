<app-header></app-header>

<ion-content class="ion-padding">
  <h2>¡Intenta adivinar el número secreto entre 1 y 10!</h2>

  <p>Intentos: {{ intentos }}</p> <!-- Mostramos el contador de intentos -->

  <ion-item>
    <ion-input
      type="number"
      [(ngModel)]="inputNumber"
      placeholder="Introduce un número"
    ></ion-input>
  </ion-item>

  <!-- Mostrar botón diferente según si ha acertado o no -->
  <ion-button *ngIf="!acertado" expand="block" (click)="checkNumber()" color="dark">
    CLICK ME
  </ion-button>

  <ion-button *ngIf="acertado" expand="block" (click)="reiniciarJuego()" color="success">
    RESET
  </ion-button>

  <p>{{ message }}</p>
