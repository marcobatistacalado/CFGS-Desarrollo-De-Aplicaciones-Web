<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Categorías
    </ion-title>
  </ion-toolbar>
  <ion-segment scrollable mode="md" (ionChange)="noticiasPorCategoria($event)">
    <ion-segment-button mode = "md" *ngFor="let categoria of categorias" [value]="categoria">
      <ion-label class="ion-text-capitalize">{{categoria}}</ion-label>
    </ion-segment-button>
  </ion-segment>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid fixed>
    <ion-row>
      <ion-col size="12" *ngFor="let n of noticias">
        <ion-card>
          <ion-card-header>
            <ion-card-subtitle>{{n.author}}</ion-card-subtitle>
              <div class="menu">
                <ion-button (click)="onClick()" expand="block" fill="clear" color="danger">
                  <ion-icon slot="icon-only" name="ellipsis-vertical-outline"></ion-icon>
                </ion-button>
              </div>
            <ion-card-title>{{n.title}}</ion-card-title>
          </ion-card-header>
          <ion-img *ngIf="n.urlToImage" [src]="n.urlToImage"></ion-img>
          <ion-content>
            <p>{{n.description}}</p>
          </ion-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
