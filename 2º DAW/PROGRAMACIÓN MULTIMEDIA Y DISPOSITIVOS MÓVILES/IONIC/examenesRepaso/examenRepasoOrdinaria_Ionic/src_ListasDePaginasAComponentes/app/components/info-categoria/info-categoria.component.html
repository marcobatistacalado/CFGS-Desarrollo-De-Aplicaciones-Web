<ion-grid fixed>
  <ion-row>
    <ion-col size="12" *ngIf="categoria">
      <ion-card class="detalle-card">
        <img [src]="'assets/imgCategorias/' + categoria.strCategoryThumb"/>

        <ion-card-header>
          <ion-card-subtitle style="text-align: center;">{{ categoria.strCategory }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          {{categoria.strCategoryDescription}}
        </ion-card-content>
        <ion-button (click)="verRecetas(categoria.strCategory)">Ver Recetas</ion-button>
      </ion-card>
    </ion-col>
  </ion-row>
</ion-grid>
